services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define la URL interna de PostgreSQL}
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET}
      APP_URL: ${APP_URL:?Define APP_URL HTTPS}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RECOVERY_FROM: ${RECOVERY_FROM:-}
      NODE_ENV: production
    expose: ["3000"]
