services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-glucosa}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-glucosa}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET}
      APP_URL: ${APP_URL:?Define APP_URL HTTPS}
      PATIENT_NAME: ${PATIENT_NAME:-Dilcia}
      NODE_ENV: production
    depends_on:
      db: {condition: service_healthy}
    ports: ["3000:3000"]
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-glucosa}
      POSTGRES_USER: ${POSTGRES_USER:-glucosa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glucosa} -d ${POSTGRES_DB:-glucosa}"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
