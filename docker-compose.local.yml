services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-glucosa}
      POSTGRES_USER: ${POSTGRES_USER:-glucosa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glucosa} -d ${POSTGRES_DB:-glucosa}"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
